name: Newest HA core

# The CI workflow tests against the newest *stable* core, which is what users
# run today. This one tests against the newest release on PyPI, beta included,
# installed under that core's own package_constraints.txt exactly as Home
# Assistant would, together with the manifest requirements. We also lean on core internals
# (camera, http, websocket_api, frontend static paths, probatio), which can
# change in any release. A beta lands about a week before each stable, so the
# daily run turns a break there into a red build while there is still time to react.
#
# A second job runs the same tests on the oldest core we declare (hacs.json), so
# a helper that only newer cores have doesn't slip in.
#
# Not a required check: a broken beta must not block merges.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      ha_version:
        description: "Core version to test (default: newest on PyPI, beta included)"
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Core ${{ matrix.core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: [newest, floor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit tests against that core
        env:
          HA_VERSION: ${{ inputs.ha_version }}
          CORE: ${{ matrix.core }}
        run: |
          docker run --rm -e HA_VERSION -e CORE -v "$(pwd)":/app -w /app python:3.14-slim bash -c '
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc-dev >/dev/null
            pip install --quiet --no-cache-dir --root-user-action=ignore packaging
            if [ -z "$HA_VERSION" ] && [ "$CORE" = floor ]; then
              HA_VERSION=$(python3 -c "import json; print(json.load(open(\"hacs.json\"))[\"homeassistant\"])")
            fi
            if [ -z "$HA_VERSION" ]; then
              HA_VERSION=$(python3 -c "
          import json, urllib.request
          from packaging.version import Version
          data = json.load(urllib.request.urlopen(\"https://pypi.org/pypi/homeassistant/json\"))
          print(max((v for v, files in data[\"releases\"].items() if files and not all(f[\"yanked\"] for f in files)), key=Version))
          ")
            fi
            echo "Testing against homeassistant==$HA_VERSION"
            python3 -c "import urllib.request; urllib.request.urlretrieve(\"https://raw.githubusercontent.com/home-assistant/core/$HA_VERSION/homeassistant/package_constraints.txt\", \"/tmp/constraints.txt\")"
            REQS=$(python3 -c "import json; print(*json.load(open(\"custom_components/ezviz_cloud/manifest.json\"))[\"requirements\"])")
            # numpy and PyTurboJPEG: importing the HA camera platform pulls in the stream and image helpers.
            pip install --quiet --no-cache-dir --root-user-action=ignore -c /tmp/constraints.txt \
              "homeassistant==$HA_VERSION" $REQS numpy PyTurboJPEG pytest pytest-asyncio
            pip list 2>/dev/null | grep -iE "^(homeassistant|probatio|aiohttp) "
            pytest tests/unit/ -q -p no:cacheprovider
          '
