name: Bug Report
description: Report a bug with the EZVIZ Cloud integration or its card
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Search existing issues (including closed ones) first.** Never paste your AppSecret, access token or verification code.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the dashboard with the card
        2. Click "Watch live"
        3. See error
    validations:
      required: true

  - type: input
    id: camera-model
    attributes:
      label: Camera model
      description: "As shown in the EZVIZ app or on the label (e.g. CS-HP2-R100-6E2WB-GR)"
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Account region
      options: [Europe, North America, South America, Singapore, India, Vietnam, China]
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.4"
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: Integration version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / app where the card runs
      placeholder: "Chrome 140 on macOS, HA Companion on iOS 26…"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Home Assistant log lines for `custom_components.ezviz_cloud`, and the browser console output (lines starting with `[ezuikit` are the most useful). Remove tokens and codes before pasting.
      render: text
