blueprint:
  name: EZVIZ Cloud - capture a photo when something happens
  description: >-
    When an entity changes (a doorbell relay, a button, a contact sensor...),
    press an EZVIZ Cloud camera's *Capture by mode*, *Capture photo* or *Record
    clip* button. *Capture by mode* follows the camera's *Mode*: nothing in
    *View*, a photo in *Photo*, a clip in *Record*, so an automation can switch
    the mode when nobody is home. The photo (and the clip) is saved to *Media →
    EZVIZ Cloud*, in the camera's folder, and the photo is shown by the camera's *Last photo*
    entity. Optionally, send it to a phone with the Home Assistant app, or
    send the live view instead: the notification goes out right away and the
    iPhone app plays the camera when you open it.
  domain: automation
  source_url: https://github.com/bvis/ezviz-cloud-hass/blob/main/blueprints/automation/ezviz_cloud/capture_photo.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    trigger_entity:
      name: Trigger
      description: The entity that starts the capture, e.g. the doorbell relay.
      selector:
        entity: {}
    trigger_state:
      name: Trigger state
      description: >-
        Capture when the trigger changes to this state. Leave it empty to
        capture on any change, which is what an event entity needs.
      default: "on"
      selector:
        text: {}
    capture_button:
      name: Capture button
      description: >-
        The camera's *Capture by mode*, *Capture photo* or *Record clip*
        button.
      selector:
        entity:
          filter:
            - integration: ezviz_cloud
              domain: button
    notify_action:
      name: Notify action (optional)
      description: >-
        A Home Assistant app notify action, e.g. notify.mobile_app_my_phone.
        Leave it empty to only save the photo.
      default: ""
      selector:
        text: {}
    photo_camera:
      name: Last photo camera (optional)
      description: The same camera's *Last photo* entity, attached to the notification.
      default: ""
      selector:
        entity:
          filter:
            - integration: ezviz_cloud
              domain: camera
    live_camera:
      name: Live camera (optional)
      description: >-
        The same camera's *Live* entity. When set, the notification is sent
        before the capture and carries the live view instead of the photo (the
        iPhone app plays it; Android shows a picture). The capture shares the
        same stream.
      default: ""
      selector:
        entity:
          filter:
            - integration: ezviz_cloud
              domain: camera
    notify_message:
      name: Notification text
      default: Someone is at the door
      selector:
        text: {}

# A doorbell can ring several times in a row; one photo per ring burst is enough.
mode: single
max_exceeded: silent

variables:
  trigger_state: !input trigger_state
  capture_button: !input capture_button
  notify_action: !input notify_action
  photo_camera: !input photo_camera
  live_camera: !input live_camera
  notify_message: !input notify_message

triggers:
  - trigger: state
    entity_id: !input trigger_entity
    not_from: [unavailable, unknown]
    not_to: [unavailable, unknown]

conditions:
  - condition: template
    value_template: "{{ trigger_state == '' or trigger.to_state.state == trigger_state }}"

actions:
  # Live view: notify first, so the stream can be opened while the capture runs.
  - if:
      - condition: template
        value_template: "{{ notify_action != '' and live_camera != '' }}"
    then:
      - action: "{{ notify_action }}"
        data:
          message: "{{ notify_message }}"
          data:
            entity_id: "{{ live_camera }}"
  # Waits until the capture is saved: about 15-20 s for a photo while the camera
  # wakes up, the clip length plus about 15 s for a clip.
  - action: button.press
    target:
      entity_id: !input capture_button
  - if:
      - condition: template
        value_template: "{{ notify_action != '' and live_camera == '' }}"
    then:
      - action: "{{ notify_action }}"
        data:
          message: "{{ notify_message }}"
          # Capture by mode in View saves nothing: don't attach an old photo.
          data: >-
            {{ {'image': '/api/camera_proxy/' ~ photo_camera}
               if photo_camera and state_attr(capture_button, 'last_capture') != 'none'
               else {} }}
